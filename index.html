<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIUM: Corporate Sabotage</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/board.css">
    <link rel="stylesheet" href="src/styles/ui.css">
    <!-- Fonts: Big Shoulders Display (titoli), Inter (corpo), IBM Plex Mono (dati/ticker) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Game Board Layer -->
        <main id="board-container">
            <div id="game-board">
                <!-- Tiles generated by JS -->
            </div>
        </main>

        <!-- UI Overlay Layer -->
        <div id="ui-layer">
            <!-- Top Bar: Global Stats -->
            <header id="game-header">
                <h1>IMPERIUM</h1>
                <div id="turn-indicator">Round: <span id="round-count">1</span> | Turn: <span
                        id="current-player-name">CEO 1</span></div>
            </header>

            <!-- Player HUDs (Floating) -->
            <div id="players-hud-container">
                <!-- Player stats inserted by JS -->
            </div>

            <!-- Pulsante audio e regole: sopra l'HUD, non sovrapposti -->
            <div id="sound-container">
                <button id="btn-settings" class="action-btn" title="Impostazioni">⚙</button>
                <button id="btn-help" class="action-btn" title="Come si gioca">?</button>
                <button id="btn-mute" class="action-btn" title="Attiva/disattiva audio">🔊</button>
            </div>

            <!-- Pulsante di ritiro: angolo opposto ai pulsanti azione -->
            <div id="surrender-container">
                <button id="btn-surrender" class="action-btn danger">RITIRATI</button>
            </div>

            <!-- Bottom Control Bar -->
            <footer id="control-bar">
                <div id="hand-container">
                    <!-- Cards go here -->
                </div>
                <div id="action-log-panel">
                    <div id="action-log-title">Registro Attività</div>
                    <div id="log-filter">
                        <!-- Pulsanti filtro (Tutti + un pallino per CEO) inseriti da JS -->
                    </div>
                    <div id="action-log">
                        <!-- Voci di log inserite da JS -->
                    </div>
                </div>
                <div id="actions-container">
                    <button id="btn-roll" class="action-btn" disabled>ROLL DICE</button>
                    <button id="btn-end-turn" class="action-btn" disabled>END TURN</button>
                </div>
            </footer>
        </div>

        <!-- Modals/overlays -->
        <div id="modal-overlay" class="hidden">
            <div id="modal-content">
                <h2 id="modal-title">Event</h2>
                <p id="modal-body">...</p>
                <div id="modal-actions"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Scripts -->
    <script src="src/app.js"></script>
</body>

</html>
